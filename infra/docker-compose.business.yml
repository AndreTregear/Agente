services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaya_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-yaya_business}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./autobot/scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-yaya_prod}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - yaya-net
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redisdata:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}" --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$REDIS_PASSWORD" ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
    - yaya-net
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yaya_s3_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_ROOT_PASSWORD}}
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
    - auth.yaya.sh:host-gateway
    networks:
    - yaya-net
  vllm:
    image: vllm/vllm-openai:v0.7.3
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    volumes:
    - ${MODEL_PATH:-/home/yaya/models/Qwen3.5-35B-A3B-GPTQ-Int4}:/model:ro
    ports:
    - 127.0.0.1:8000:8000
    command: '--model /model --served-model-name qwen3.5-35b-a3b --host 0.0.0.0
      --port 8000 --tensor-parallel-size 2 --max-model-len 65536
      --gpu-memory-utilization 0.89 --quantization gptq --dtype float16
      --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser
      qwen3 --enable-prefix-caching --enable-chunked-prefill --max-num-seqs 16
      --api-key ${AI_API_KEY:?AI_API_KEY required} --language-model-only

      '
    healthcheck:
      test:
      - CMD-SHELL
      - 'curl -sf -H ''Authorization: Bearer ${AI_API_KEY}'' http://localhost:8000/v1/models
        || exit 1'
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    ipc: host
    networks:
    - yaya-net
  whisper:
    image: whisper-turbo:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            capabilities:
            - gpu
    ports:
    - 127.0.0.1:9300:8000
    environment:
      WHISPER_MODEL: large-v3-turbo
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE: float16
      WHISPER_DELETE_AFTER_TRANSCRIPTION: 'true'
      TMPDIR: /dev/shm
    tmpfs:
    - /tmp:size=256m
    - /dev/shm:size=512m
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
    - yaya-net
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.4.2
    restart: unless-stopped
    ports:
    - 127.0.0.1:9400:8880
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '1'
            capabilities:
            - gpu
    environment:
      CUDA_VISIBLE_DEVICES: '0'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8880/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
    - yaya-net
  calcom:
    image: calcom.docker.scarf.sh/calcom/cal.com:v4.7.2
    restart: unless-stopped
    ports:
    - 127.0.0.1:3002:3000
    environment:
      DATABASE_URL: postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASS:-${CALCOM_DB_PASS}}@postgres:5432/calcom_db
      DATABASE_DIRECT_URL: postgresql://${CALCOM_DB_USER:-calcom}:${CALCOM_DB_PASS:-${CALCOM_DB_PASS}}@postgres:5432/calcom_db
      NEXTAUTH_SECRET: ${CALCOM_SECRET:?CALCOM_SECRET required}
      NEXT_PUBLIC_WEBAPP_URL: ${CALCOM_URL:-http://localhost:3002}
      NEXT_PUBLIC_API_V2_URL: ${CALCOM_URL:-http://localhost:3002}/api/v2
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY:?CALCOM_ENCRYPTION_KEY required}
      NODE_ENV: production
      OIDC_ISSUER_URL: https://auth.yaya.sh/application/o/calcom/
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
    - auth.yaya.sh:host-gateway
    networks:
    - yaya-net
  lago-api:
    image: getlago/api:v1.20.1
    restart: unless-stopped
    ports:
    - 127.0.0.1:3010:3000
    env_file:
    - autobot/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaya_prod}:${POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/lago_db
      REDIS_URL: redis://redis:6379/1
      LAGO_API_URL: ${LAGO_API_URL:-http://localhost:3010}
      SECRET_KEY_BASE: ${LAGO_SECRET:?LAGO_SECRET required}
      LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY}
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: 'true'
      LAGO_DISABLE_SIGNUP: 'false'
      ENCRYPTION_PRIMARY_KEY: ${LAGO_ENC_PRIMARY:?LAGO_ENC_PRIMARY required}
      ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENC_DETERMINISTIC:?LAGO_ENC_DETERMINISTIC required}
      ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENC_SALT:?LAGO_ENC_SALT required}
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - yaya-net
  lago-worker:
    image: getlago/api:v1.20.1
    restart: unless-stopped
    command:
    - ./scripts/start.worker.sh
    env_file:
    - autobot/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaya_prod}:${POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/lago_db
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY_BASE: ${LAGO_SECRET:?LAGO_SECRET required}
      LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY}
      RAILS_ENV: production
      ENCRYPTION_PRIMARY_KEY: ${LAGO_ENC_PRIMARY:?LAGO_ENC_PRIMARY required}
      ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENC_DETERMINISTIC:?LAGO_ENC_DETERMINISTIC required}
      ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENC_SALT:?LAGO_ENC_SALT required}
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      lago-api:
        condition: service_started
    networks:
    - yaya-net
  lago-front:
    image: getlago/front:v1.20.1
    restart: unless-stopped
    ports:
    - 127.0.0.1:8080:80
    environment:
      API_URL: ${LAGO_API_URL:-http://localhost:3010}
      APP_ENV: production
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      lago-api:
        condition: service_started
    networks:
    - yaya-net
  metabase:
    image: metabase/metabase:v0.52.5
    restart: unless-stopped
    ports:
    - 127.0.0.1:3003:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-yaya_prod}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      MB_DB_HOST: postgres
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
    - auth.yaya.sh:host-gateway
    networks:
    - yaya-net
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.2
    restart: unless-stopped
    command: server
    ports:
    - 127.0.0.1:9090:9000
    - 127.0.0.1:9443:9443
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 3
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'false'
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
      AUTHENTIK_DEFAULT_USER_CHANGE_NAME: 'true'
      AUTHENTIK_DEFAULT_USER_CHANGE_EMAIL: 'true'
      AUTHENTIK_DEFAULT_USER_CHANGE_USERNAME: 'true'
    volumes:
    - authentik_media:/media
    - authentik_templates:/templates
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - yaya-net
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 3
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
    volumes:
    - authentik_media:/media
    - authentik_templates:/templates
    - authentik_certs:/certs
    deploy:
      resources:
        limits:
          memory: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - yaya-net
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-yaya_prod}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: ${POSTGRES_DB:-yaya_business}
    volumes:
    - ./backups:/backups
    deploy:
      resources:
        limits:
          memory: 512m
    entrypoint: "sh -c '\n  apk add --no-cache dcron &&\n  echo \"0 3 * * * pg_dump\
      \ -Fc > /backups/yaya_$$(date +\\%Y\\%m\\%d_\\%H\\%M\\%S).dump && find /backups\
      \ -name yaya_*.dump -mtime +7 -delete 2>&1\" | crontab - &&\n  echo \"[backup]\
      \ Daily at 3am UTC\" &&\n  crond -f -l 2\n'\n"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - yaya-net
networks:
  yaya-net:
    driver: bridge
volumes:
  pgdata:
    external: true
    name: autobot_pgdata
  redisdata:
    external: true
    name: autobot_redisdata
  miniodata:
    external: true
    name: autobot_miniodata
  authentik_media: null
  authentik_templates: null
  authentik_certs: null
