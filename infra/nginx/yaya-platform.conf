# ═══════════════════════════════════════════════════════════════
# Yaya Platform — Unified Nginx Config
# All services resolve locally with server_name routing
# TLS termination + security headers on every HTTPS block
# ═══════════════════════════════════════════════════════════════

# ── Shared SSL settings (included in every HTTPS server block) ──
# ssl_certificate /etc/ssl/certs/yaya.sh.pem;
# ssl_certificate_key /etc/ssl/private/yaya.sh.key;
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
# ssl_prefer_server_ciphers on;
# ssl_session_cache shared:SSL:10m;
# ssl_session_timeout 10m;

# ── Auth (Authentik SSO) — HTTP→HTTPS redirect ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name auth.yaya.sh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name auth.yaya.sh;

    ssl_certificate /etc/ssl/certs/yaya.sh.pem;
    ssl_certificate_key /etc/ssl/private/yaya.sh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

