# ═══════════════════════════════════════════════════════════════
# Yaya Salud — Production Overlay
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds resource limits, log rotation, and production hardening.

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  yaya-health:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  backup:
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
